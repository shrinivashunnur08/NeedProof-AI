name: CI

on:
  push:
    branches: [main, "feat/**", "w*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      GEMINI_BACKEND: mock   # never call a paid model in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # The ignored files verify one-time patch installers against old source hashes; they are not app behaviour.
      - run: >
          python -m pytest -q
          --ignore=tests/test_compact_sidebar_16c2.py
          --ignore=tests/test_firebase_offline_preview.py
          --ignore=tests/test_release_gate_16b2.py
          --ignore=tests/test_release_gate_16b2b.py
          --ignore=tests/test_chunk17c_runner_path.py
          --ignore=tests/test_chunk16c4_route_split.py

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx eslint src/loop src/App.tsx
      - run: npm run build
